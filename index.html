.gate .logo{width:190px;background-position:center}
.brand .sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand .moon{width:36px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--mint),var(--sky),var(--lav),var(--peri));margin-top:8px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--ink)}
nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 10px 4px}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface2)}
.who img{width:30px;height:30px;border-radius:50%}
.who .n{font-weight:600;font-size:13px}.who .r{font-size:11.5px;color:var(--muted)}
main{padding:24px 28px 90px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-family:var(--display);font-size:26px;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f>span{letter-spacing:.02em}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.neu{background:var(--surface2);color:var(--muted)}
.pill.tier-j{background:var(--mint);color:#17463C}.pill.tier-m{background:var(--lav);color:#1E2E5C}.pill.tier-s{background:var(--peri);color:#16174A}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.muted{color:var(--muted)}.faint{color:var(--faint)}.mono{font-family:var(--mono)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.actions{display:flex;flex-direction:column;gap:8px}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.act .ic{width:8px;align-self:stretch;border-radius:4px;flex:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(18,19,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.sheet{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;max-width:90vw}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars div{flex:1;background:var(--lav);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.today{background:var(--accent)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.hbar .t{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--peri)}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:12.5px}
.oc:hover{border-color:var(--accent)}
.pos{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-height:60vh;overflow:auto}
.pc{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left}
.pc:hover{border-color:var(--accent)}.pc[disabled]{opacity:.45;cursor:not-allowed}
.pc .nm{font-weight:600;font-size:13px;line-height:1.25}.pc .mt{font-size:11.5px;color:var(--muted)}
.cart li{display:grid;grid-template-columns:minmax(0,1fr) 64px 80px 24px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.cart ul{list-style:none;margin:0;padding:0}
.receipt{font-family:var(--mono);font-size:12px;background:#fff;color:#1b1b1b;width:300px;max-width:100%;padding:16px 14px;border-radius:6px;box-shadow:var(--shadow);margin:0 auto;white-space:pre-wrap;line-height:1.5}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--surface2)}
.gate{max-width:520px;margin:12vh auto;text-align:center;display:flex;flex-direction:column;gap:12px;padding-inline:16px}
.bottomnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px 16px 96px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.pos{grid-template-columns:1fr}
  .bottomnav{display:flex;flex-direction:row;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;z-index:40;overflow-x:auto}
  .bottomnav button{flex:1 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:6px 2px;border-radius:8px}
  .bottomnav button.on{color:var(--ink);background:var(--accent-soft)}
  .bottomnav svg{width:20px;height:20px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    else if(m.tipo==="ajuste")st[m.loc]=(st[m.loc]||0)+q;
    else if(m.tipo==="traslado"){st[m.from]=(st[m.from]||0)-q;st[m.to]=(st[m.to]||0)+q}
    else if(m.tipo==="sheet"){st.jinotega+=num(m.dj);st.bodega+=num(m.db)}}
  for(const s of S.sales){if(!s.items)continue;const vend=VENDIDO.includes(s.estado),rsv=RESERVA.includes(s.estado);if(!vend&&!rsv)continue;
    for(const it of s.items){if(it.pid!==pid)continue;const q=num(it.qty);if(vend)st[s.loc||"jinotega"]=(st[s.loc||"jinotega"]||0)-q;else res+=q}}
  const total=st.jinotega+st.managua+st.bodega;
  return {...st,total,reservado:res,disponible:total-res,transito:num(p&&p.transito)};
}
function estadoProd(p,st){
  if(p.estadoManual==="preorder")return["Pre-order","info"];
  if(st.total<=0)return["Agotado","bad"];
  if(st.disponible<=0&&st.reservado>0)return["Reservado","info"];
  if(st.disponible<=num(S.cfg.stockCritico))return["Últimas unidades","bad"];
  if(st.disponible<=num(S.cfg.stockBajo))return["Stock bajo","warn"];
  return["Disponible","ok"];
}
const costOf=pid=>{const c=S.costs[pid];return c?num(c.costo):null};
const saleSub=s=>(s.items||[]).reduce((a,it)=>a+num(it.qty)*num(it.precio)-num(it.desc),0);
const saleTotal=s=>Math.max(0,saleSub(s)-num(s.descuento)+num(s.envio));
const saleCOGS=s=>(s.items||[]).reduce((a,it)=>{const c=it.costo!=null?num(it.costo):costOf(it.pid);return a+num(it.qty)*(c||0)},0);
const paidSales=(neg)=>S.sales.filter(s=>VENDIDO.includes(s.estado)&&(!neg||(s.negocio||"hebeluna")===neg));
function tierOf(cid){const n=S.sales.filter(s=>s.clienteId===cid&&VENDIDO.includes(s.estado)).length;
  if(n>=16)return{n,t:"Beauty Star",k:"s"};if(n>=6)return{n,t:"Master Beauty",k:"m"};return{n,t:n?"Cliente Junior":"Nueva",k:"j"}}
function suggested(pid){const c=S.costs[pid];if(!c||c.costo==null||c.costo==="")return null;return Math.ceil((num(c.costo)*(1+num(S.cfg.impuesto))+num(c.envio))*(1+num(S.cfg.ganancia)))}
function lastSaleDate(pid){let d=null;for(const s of S.sales){if(!VENDIDO.includes(s.estado))continue;if((s.items||[]).some(i=>i.pid===pid)&&(!d||s.fecha>d))d=s.fecha}return d}
function rangeFilter(list,from,to){return list.filter(s=>s.fecha>=from&&s.fecha<=to)}

  `<div class="tbl"><table><thead><tr><th>Recibo</th><th>Fecha</th><th>Cliente</th><th>Canal</th><th>Pago</th><th>Estado</th><th class="n">Total</th>${isOwner()?'<th class="n">Utilidad</th>':""}</tr></thead><tbody>
  ${hist.map(s=>{const c=S.customers[s.clienteId];return `<tr class="click" data-sale="${h(s.id)}"><td class="mono">${h(s.num)}</td><td>${fmtD(s.fecha)}</td><td>${h(c?c.nombre:"—")}</td><td>${h(s.canal||"")}</td><td>${h(s.metodo||"")}</td><td>${estPill(s.estado)}</td><td class="n">${usd(saleTotal(s))}</td>${isOwner()?`<td class="n">${usd(saleTotal(s)-saleCOGS(s))}</td>`:""}</tr>`}).join("")||`<tr><td colspan="8" class="empty">Todavía no hay ventas registradas.</td></tr>`}</tbody></table></div>`}`;

/* ---- Inventario ---- */
function invProducts(){
  const f=S.filters;const own=isOwner();const t=todayStr();
  let prods=Object.values(S.products).filter(p=>(p.negocio||"hebeluna")===S.negocio&&p.activo!==false);
  const q=(f.q||"").toLowerCase();
  const rows=prods.map(p=>{const st=stockOf(p.id);const [e,k]=estadoProd(p,st);return{p,st,e,k}})
   .filter(r=>(!q||[r.p.id,r.p.marca,r.p.nombre,r.p.tono,r.p.talla,r.p.sku,r.p.proveedor,r.p.nota].join(" ").toLowerCase().includes(q))&&(!f.cat||r.p.cat===f.cat)&&(!f.loc||r.st[f.loc]>0))
   .filter(r=>{switch(f.estado){case"":return true;case"reponer":return["Agotado","Últimas unidades"].includes(r.e);case"margen":{const c=costOf(r.p.id);return c&&num(r.p.precio)&&(num(r.p.precio)-c)/num(r.p.precio)<num(S.cfg.margenObjetivo)}
     case"viejos":{const ls=lastSaleDate(r.p.id)||r.p.fechaIngreso;return r.st.total>0&&ls&&daysBetween(ls,t)>=num(S.cfg.diasSinRotacion)}
     case"vence":return r.p.vence&&daysBetween(t,r.p.vence)<=num(S.cfg.diasVence)&&r.st.total>0;case"sinprecio":return!num(r.p.precio)&&!num(r.p.precioNio);case"rotacion":return rotacion(r.p.id)>=3;case"falta":return !!faltaDato(r.p);case"notas":return !!(r.p.nota||"").trim();default:return r.e===f.estado}})
   .sort((a,b)=>a.p.id.localeCompare(b.p.id,undefined,{numeric:true}));
  const cats=[...new Set(prods.map(p=>p.cat).filter(Boolean))].sort();
  return `<div class="top"><div><div class="eyebrow">${rows.length} de ${prods.length} productos</div><h1>Inventario</h1></div>
   <div class="row">${negSwitch()}${can("inventario")?`<button class="btn" data-act="mov">Movimiento</button><button class="btn p" data-act="newprod">+ Producto</button>`:""}<button class="btn" data-act="export">Exportar a Excel/Sheets</button></div></div>
  <!--TABS-->
  <div class="row" style="margin-bottom:12px">
   <input id="f_q" style="max-width:280px" placeholder="Buscar" value="${h(f.q)}" aria-label="Buscar">
   <select id="f_cat" style="max-width:170px" aria-label="Categoría"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${f.cat===c?"selected":""}>${h(c)}</option>`).join("")}</select>
   <select id="f_est" style="max-width:200px" aria-label="Estado">${[["","Todos los estados"],["Disponible","Disponible"],["Stock bajo","Stock bajo"],["Últimas unidades","Últimas unidades"],["Agotado","Agotado"],["Reservado","Reservado"],["Pre-order","Pre-order"],["reponer","Necesita reposición"],["falta","Falta tono / talla"],["notas","Con notas por revisar"],["viejos",`Sin rotación +${S.cfg.diasSinRotacion} días`],["rotacion","Alta rotación"],["vence","Próximo a vencer"],["sinprecio","Sin precio"],...(own?[["margen","Margen bajo"]]:[])].map(o=>`<option value="${o[0]}" ${f.estado===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
   <select id="f_loc" style="max-width:190px" aria-label="Ubicación"><option value="">Todas las ubicaciones</option>${Object.keys(LOCS).map(k=>`<option value="${k}" ${f.loc===k?"selected":""}>${LOCSHORT[k]}</option>`).join("")}</select></div>
  <div class="tbl"><table><thead><tr><th></th><th>ID</th><th>Producto</th><th>Tono / Talla</th><th>Categoría</th><th class="n">Precio</th>${own?'<th class="n">Costo</th><th class="n">Sugerido</th><th class="n">Margen</th>':""}<th class="n">Jinotega</th><th class="n">Managua</th><th class="n">Bodega</th><th class="n">Reserv.</th><th class="n">Tránsito</th><th class="n">Disp.</th><th>Estado</th><th>Ingreso</th></tr></thead><tbody>
  ${rows.map(({p,st,e,k})=>{const c=costOf(p.id);const mg=c!=null&&num(p.precio)?(num(p.precio)-c)/num(p.precio):null;
   return `<tr class="click" data-prod="${h(p.id)}"><td>${p.foto?`<img class="thumb" src="https://drive.google.com/thumbnail?sz=w600&id=${h(p.foto)}" alt="">`:`<span class="thumb" style="display:inline-block"></span>`}</td><td class="mono">${h(p.id)}</td><td><div style="font-weight:600">${h(p.nombre)}</div><div class="muted" style="font-size:12px">${h(p.marca||"")}${p.sku?` · <span class="mono">${h(p.sku)}</span>`:""}</div>${faltaDato(p)?`<span class="pill warn" style="margin-top:3px">${faltaDato(p)}</span>`:""}${p.nota?`<div class="faint" style="font-size:11.5px;max-width:34ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${h(p.nota)}">${h(p.nota)}</div>`:""}</td>
   <td>${h([p.tono,p.talla].filter(Boolean).join(" · "))||'<span class="faint">—</span>'}</td><td>${h(p.cat||"")}</td>
   <td class="n">${num(p.precio)?usd(p.precio):'<span class="pill bad">Sin precio</span>'}<div class="muted" style="font-size:11.5px">C$${nioOf(p).toLocaleString("en-US")}</div></td>
   ${own?`<td class="n">${c!=null?usd(c):'<span class="faint">—</span>'}</td><td class="n">${suggested(p.id)?usd(suggested(p.id)):'<span class="faint">—</span>'}</td><td class="n">${mg!=null?`<span class="${mg<num(S.cfg.margenObjetivo)?"pill warn":""}">${pct(mg)}</span>`:'<span class="faint">—</span>'}</td>`:""}
   <td class="n">${st.jinotega}</td><td class="n">${st.managua}</td><td class="n">${st.bodega}</td><td class="n">${st.reservado||""}</td><td class="n">${st.transito||""}</td><td class="n"><b>${st.disponible}</b><div class="muted" style="font-size:11px">${st.total>0&&num(p.precio)?usd(st.total*num(p.precio)):""}</div></td><td><span class="pill ${k}">${e}</span></td><td class="muted">${fmtD(p.fechaIngreso)}</td></tr>`}).join("")||`<tr><td colspan="16" class="empty">No hay productos con ese filtro.</td></tr>`}
  </tbody></table></div>`;
}
function rotacion(pid){const t=todayStr(),f=addDays(t,-30);return S.sales.filter(s=>VENDIDO.includes(s.estado)&&s.fecha>=f).reduce((a,s)=>a+(s.items||[]).filter(i=>i.pid===pid).reduce((b,i)=>b+num(i.qty),0),0)}

/* ---- Compras ---- */
const ordSub=o=>(o.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.costoUnit),0);
const ordTotal=o=>ordSub(o)+num(o.shipping)+num(o.impuestos)+num(o.otros);
function landed(o){const sub=ordSub(o),extra=num(o.shipping)+num(o.impuestos)+num(o.otros);return(o.items||[]).map(i=>{const line=num(i.qty)*num(i.costoUnit);const share=sub?line/sub:0;return{...i,landedUnit:num(i.qty)?(line+extra*share)/num(i.qty):0}})}
VIEWS.comp=()=>{
  const list=S.compras.slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const transit=list.filter(o=>o.estado!=="Recibido");const porPagar=list.reduce((a,o)=>a+Math.max(0,ordTotal(o)-num(o.pagado)),0);
  return `<div class="top"><div><div class="eyebrow">Importación y reposición</div><h1>Compras</h1></div><button class="btn p" data-act="neword">+ Orden de compra</button></div>
  <div class="grid g3" style="margin-bottom:16px">${kpi("Órdenes abiertas",transit.length,"en tránsito")}${kpi("Mercadería en tránsito",usd(transit.reduce((a,o)=>a+ordTotal(o),0)),transit.reduce((a,o)=>a+(o.items||[]).reduce((b,i)=>b+num(i.qty),0),0)+" unidades")}${kpi("Cuentas por pagar",usd(porPagar),"")}</div>
  <div class="tbl"><table><thead><tr><th>Orden</th><th>Fecha</th><th>Proveedor / tienda</th><th class="n">Paquetes</th><th class="n">Productos</th><th class="n">Envío</th><th class="n">Impuestos</th><th class="n">Costo final</th><th class="n">Por pagar</th><th>Estado</th></tr></thead><tbody>
  ${list.map(o=>`<tr class="click" data-ord="${h(o.id)}"><td class="mono">${h(o.num)}</td><td>${fmtD(o.fecha)}</td><td>${h(o.proveedor||"")}${o.tienda?`<div class="muted" style="font-size:12px">${h(o.tienda)}</div>`:""}</td><td class="n">${num(o.paquetes)||""}</td><td class="n">${usd(ordSub(o))}</td><td class="n">${usd(o.shipping)}</td><td class="n">${usd(o.impuestos)}</td><td class="n"><b>${usd(ordTotal(o))}</b></td><td class="n">${ordTotal(o)-num(o.pagado)>0.009?`<span class="pill warn">${usd(ordTotal(o)-num(o.pagado))}</span>`:'<span class="pill ok">Pagado</span>'}</td><td>${o.estado==="Recibido"?`<span class="pill ok">Recibido ${fmtD(o.recibido)}</span>`:'<span class="pill info">En tránsito</span>'}</td></tr>`).join("")||'<tr><td colspan="10" class="empty">Todavía no hay órdenes. Crea la primera con “+ Orden de compra”.</td></tr>'}</tbody></table></div>
  <p class="muted" style="font-size:12px">El costo final reparte envío, impuestos y otros cargos entre los productos según su valor. Al marcar la orden como recibida, el inventario sube y el costo de cada producto se actualiza al costo real (landed cost).</p>`;
};

/* ---- Clientes ---- */
VIEWS.cli=()=>{
  const q=(S.sub.cliq||"").toLowerCase();const t=todayStr();
  const rows=Object.values(S.customers).map(c=>{const ss=S.sales.filter(s=>s.clienteId===c.id&&VENDIDO.includes(s.estado));const tot=ss.reduce((a,s)=>a+saleTotal(s),0);const last=ss.map(s=>s.fecha).sort().pop();
   const fav={};ss.forEach(s=>(s.items||[]).forEach(i=>fav[i.pid]=(fav[i.pid]||0)+num(i.qty)));const top=Object.entries(fav).sort((a,b)=>b[1]-a[1])[0];
   let freq="";if(ss.length>1){const ds=ss.map(s=>s.fecha).sort();freq=Math.round(daysBetween(ds[0],ds[ds.length-1])/(ss.length-1))+" días"}
   return{c,n:ss.length,tot,last,top,freq,tier:tierOf(c.id)}})
   .filter(r=>!q||[r.c.nombre,r.c.telefono,r.c.ciudad].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.tot-a.tot);
  const nuevos=rows.filter(r=>r.n<=1).length,rec=rows.filter(r=>r.n>1).length;

  <div class="row" style="margin-bottom:10px"><input id="cliq" style="max-width:320px" placeholder="Buscar por nombre, teléfono o ciudad" value="${h(S.sub.cliq||"")}" aria-label="Buscar cliente">
  <span class="pill tier-j">Cliente Junior 1–5</span><span class="pill tier-m">Master Beauty 6–15</span><span class="pill tier-s">Beauty Star 16+</span></div>
  <div class="tbl"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Ciudad</th><th>Nivel</th><th class="n">Compras</th><th class="n">Total</th><th class="n">Ticket prom.</th><th>Última compra</th><th>Frecuencia</th><th>Favorito</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="click" data-cli="${h(r.c.id)}"><td style="font-weight:600">${h(r.c.nombre)}</td><td>${h(r.c.telefono||"")}</td><td>${h(r.c.ciudad||"")}</td><td><span class="pill tier-${r.tier.k}">${r.tier.t}</span></td><td class="n">${r.n}</td><td class="n">${usd(r.tot)}</td><td class="n">${r.n?usd(r.tot/r.n):""}</td><td>${fmtD(r.last)}</td><td>${r.freq}</td><td>${r.top?h(pname(r.top[0])):""}</td></tr>`).join("")||'<tr><td colspan="10" class="empty">Todavía no hay clientes. Se crean aquí o al registrar una venta.</td></tr>'}</tbody></table></div>`;
};

/* ---- Finanzas ---- */
VIEWS.fin=()=>{
  const tab=S.sub.fintab||"res";const t=todayStr();const neg=S.negocio;
  const per=S.sub.finper||"mes";
  const from=per==="dia"?t:per==="semana"?addDays(t,-6):per==="mes"?t.slice(0,8)+"01":per==="anio"?t.slice(0,5)+"01-01":"2000-01-01";
  const sales=rangeFilter(paidSales(neg),from,t);
  const ventas=sales.reduce((a,s)=>a+saleTotal(s),0),cogs=sales.reduce((a,s)=>a+saleCOGS(s),0);

function resumenDe(neg){
  const t=todayStr(),mStart=t.slice(0,8)+"01";
  const prods=Object.values(S.products).filter(p=>(p.negocio||"hebeluna")===neg&&p.activo!==false);
  const r={n:prods.length,jin:0,man:0,bod:0,tot:0,val:0,valN:0,costo:0,agot:0,ult:0,bajo:0,falta:0,sinPrecio:0,res:0,tra:0};
  prods.forEach(p=>{const st=stockOf(p.id);r.jin+=st.jinotega;r.man+=st.managua;r.bod+=st.bodega;r.tot+=st.total;r.res+=st.reservado;r.tra+=st.transito;
    const q=Math.max(0,st.total);r.val+=q*num(p.precio);r.valN+=q*nioOf(p);const c=costOf(p.id);if(c!=null)r.costo+=q*c;
    const e=estadoProd(p,st)[0];if(e==="Agotado")r.agot++;else if(e==="Últimas unidades")r.ult++;else if(e==="Stock bajo")r.bajo++;
    if(faltaDato(p))r.falta++;if(!num(p.precio)&&!num(p.precioNio))r.sinPrecio++});
  const paid=paidSales(neg);const hoy=rangeFilter(paid,t,t),mes=rangeFilter(paid,mStart,t);
  r.vHoy=hoy.reduce((a,s)=>a+saleTotal(s),0);r.vMes=mes.reduce((a,s)=>a+saleTotal(s),0);
  r.uMes=mes.reduce((a,s)=>a+(s.items||[]).reduce((b,i)=>b+num(i.qty),0),0);
  return r;
}

/* ---- Sincronía con el Google Sheet y el catálogo de Canva ---- */
const normH=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9$]+/g," ").trim();
const moneyN=s=>{const v=parseFloat(String(s??"").replace(/C\$|\$|,|\s/g,""));return isFinite(v)?v:null};
const limpiaNota=n=>String(n||"").split(/\s·\s/).filter(x=>!/costo\s*(de\s*)?\$|costo\s*US|\$\s*[\d.]+\s*c\/u/i.test(x)).join(" · ").trim();
function parseSheetRows(rows){
  const hi=rows.findIndex(r=>r&&r.some(c=>normH(c)==="id")&&r.some(c=>normH(c).startsWith("producto")));
  if(hi<0)return{err:"No encontré la fila de títulos (ID, Categoría, Marca, Producto…). Copia la hoja completa, desde la fila de títulos."};
  const H=rows[hi].map(normH);const ix=k=>H.findIndex(x=>x===k||x.startsWith(k));
  const C={id:ix("id"),cat:ix("categoria"),marca:ix("marca"),nombre:ix("producto"),tono:ix("tono"),talla:ix("talla"),necesita:ix("necesita"),sku:ix("codigo"),precio:ix("precio us$"),precioN:ix("precio c$"),stL:ix("stock local"),stB:ix("stock bodega"),nota:ix("notas"),costo:ix("costo"),envio:ix("envio")};
  if(C.precio<0)C.precio=H.findIndex(x=>x.startsWith("precio")&&x.includes("us"));
  const out=[];
  for(const r of rows.slice(hi+1)){const id=String(r[C.id]||"").trim();if(!/^(HB|RS)-\d+$/.test(id))continue;
    const g=k=>C[k]>=0?String(r[C[k]]??"").trim():"";
    out.push({id,negocio:id.startsWith("RS")?"rashi":"hebeluna",cat:g("cat"),marca:g("marca"),nombre:g("nombre"),tono:g("tono"),talla:g("talla"),necesita:g("necesita")||"No",sku:g("sku"),
      precio:moneyN(g("precio"))||0,precioN:moneyN(g("precioN")),stL:C.stL>=0?moneyN(g("stL")):null,stB:C.stB>=0?moneyN(g("stB")):null,nota:limpiaNota(g("nota")),costo:C.costo>=0?moneyN(g("costo")):undefined,envio:C.envio>=0?moneyN(g("envio")):undefined})}
  return{items:out};
}
function diffSheet(items){
  const ch=[];const r10=v=>Math.round(v*num(S.cfg.tasa)/(num(S.cfg.redondeo)||1))*(num(S.cfg.redondeo)||1);
  for(const it of items){const p=S.products[it.id];
    const fijo=it.precioN!=null&&it.precio&&Math.abs(it.precioN-r10(it.precio))>(num(S.cfg.redondeo)||1)?it.precioN:null;
    if(!p){ch.push({id:it.id,tipo:"nuevo",it,fijo,txt:`Producto nuevo: ${it.marca} ${it.nombre} ${[it.tono,it.talla].filter(Boolean).join(" · ")} · ${usd(it.precio)} · Local ${it.stL??0} · Bodega ${it.stB??0}`});continue}
    const campos=[["cat","Categoría"],["marca","Marca"],["nombre","Producto"],["tono","Tono"],["talla","Talla"],["necesita","Necesita"],["sku","SKU"],["nota","Notas"]].filter(([k])=>String(p[k]||"")!==String(it[k]||"")&&!(k==="necesita"&&!p[k]&&it[k]==="No"));
    const upd={};campos.forEach(([k])=>upd[k]=it[k]);
    if(num(p.precio)!==num(it.precio)){upd.precio=it.precio;campos.push(["precio","Precio US$"])}
    if((p.precioNio||null)!==fijo){upd.precioNio=fijo;campos.push(["precioNio","Precio fijo C$"])}
    if(campos.length)ch.push({id:it.id,tipo:"datos",upd,txt:campos.map(([k,l])=>`${l}: ${k==="precio"?usd(p[k]):h(p[k]??"—")} → ${k==="precio"?usd(upd[k]):h(upd[k]??"—")}`).join(" · ")});
    const st=stockOf(it.id);
    if(it.stL!=null&&it.stL!==st.jinotega)ch.push({id:it.id,tipo:"stock",loc:"jinotega",delta:it.stL-st.jinotega,txt:`Stock Jinotega: CRM ${st.jinotega} → Sheet ${it.stL}`});
    if(it.stB!=null&&it.stB!==st.bodega)ch.push({id:it.id,tipo:"stock",loc:"bodega",delta:it.stB-st.bodega,txt:`Stock Bodega: CRM ${st.bodega} → Sheet ${it.stB}`});
    if(isOwner()&&it.costo!==undefined){const c=S.costs[it.id]||{};if((c.costo??null)!==(it.costo??null)&&!(c.costo==null&&it.costo==null))ch.push({id:it.id,tipo:"costo",costo:it.costo,envio:it.envio||0,txt:`Costo: ${c.costo!=null?usd(c.costo):"—"} → ${it.costo!=null?usd(it.costo):"—"}`})}}
  const enSheet=new Set(items.map(i=>i.id));const negs=new Set(items.map(i=>i.negocio));
  Object.values(S.products).filter(p=>p.activo!==false&&negs.has(p.negocio||"hebeluna")&&!enSheet.has(p.id)).forEach(p=>ch.push({id:p.id,tipo:"solocrm",txt:`Está en el CRM pero no en el Sheet (${pname(p.id)}). No se toca; agrégalo al Sheet si debe estar.`,info:true}));
  return ch;
}

   ${acc.length?`<div class="row" style="margin-bottom:8px"><button class="btn p" data-act="syncapply">Aplicar ${acc.length} cambios</button><button class="btn" data-act="syncall">Marcar todo</button><button class="btn" data-act="syncnone">Desmarcar todo</button><button class="btn ghost" data-sub="syncPrev:">Cancelar</button></div>`:`<p><b>Todo coincide.</b> El CRM ya está igual que el Sheet.</p>`}
   <div class="tbl"><table><thead><tr><th></th><th>ID</th><th>Cambio</th></tr></thead><tbody>

function catEstado(p){const st=stockOf(p.id);return{precio:num(p.precio),nio:nioOf(p),disp:p.estadoManual==="preorder"?"preorder":st.disponible>0?"si":"agotado"}}
function catPendientes(){
  const snap=S.catSnap;if(!snap||!snap.items)return`<p class="muted" style="font-size:13px">Todavía no hay un punto de partida. Cuando el catálogo esté al día, toca "Marcar catálogo como actualizado" y desde ahí te aviso qué cambió.</p>`;
  const L=[];Object.values(S.products).filter(p=>p.activo!==false).forEach(p=>{const a=snap.items[p.id],b=catEstado(p);
    if(!a){L.push([p.id,"Nuevo en inventario",b.disp==="si"?"Agregar al catálogo":""]);return}
    if(a.disp!==b.disp)L.push([p.id,b.disp==="agotado"?"Se agotó":b.disp==="si"?"Volvió a haber":"Ahora es pre-order","Marcar "+(b.disp==="agotado"?"AGOTADO":b.disp==="si"?"disponible":"pre-order")]);
    if(a.precio!==b.precio)L.push([p.id,`Precio ${usd(a.precio)} → ${usd(b.precio)}`,"Cambiar precio y C$"+b.nio.toLocaleString("en-US")])});
  Object.keys(snap.items).filter(id=>!S.products[id]||S.products[id].activo===false).forEach(id=>L.push([id,"Ya no está en inventario","Quitar del catálogo"]));
  if(!L.length)return`<p style="font-size:13px"><b>El catálogo está al día</b> <span class="muted">desde el ${fmtD((snap.fecha||"").slice(0,10))}.</span></p>`;
  return`<div class="tbl" style="max-height:260px;overflow:auto"><table><tbody>${L.map(([id,a,b])=>`<tr><td class="mono">${h(id)}</td><td>${h(pname(id))}<div class="muted" style="font-size:12px">${h(a)}</div></td><td class="muted" style="font-size:12px">${h(b)}</td></tr>`).join("")}</tbody></table></div><p class="muted" style="font-size:12px">${L.length} cambios pendientes desde el ${fmtD((snap.fecha||"").slice(0,10))}.</p>`;
}
async function readSyncFile(f){
  try{let rowsets=[];
    if(/\.xlsx$/i.test(f.name)){if(!window.XLSX)throw new Error("El lector de Excel no cargó");const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
      const names=wb.SheetNames.filter(n=>/hebeluna|rashi/i.test(n)&&!/resumen/i.test(n));(names.length?names:wb.SheetNames).forEach(n=>rowsets.push(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""})))}
    else{const t=await f.text();rowsets.push(t.split(/\r?\n/).map(l=>l.split(l.includes("\t")?"\t":",").map(x=>x.replace(/^"|"$/g,""))))}
    let items=[];for(const rs of rowsets){const r=parseSheetRows(rs);if(r.items)items=items.concat(r.items)}
    if(!items.length){S.sub.syncPrev={err:"No encontré productos con ID HB-### o RS-### en el archivo."};render();return}
    S.sub.syncPrev={n:items.length,ch:diffSheet(items)};render();
  }catch(e){S.sub.syncPrev={err:e.message||String(e)};render()}
}
async function applySync(){
  const P=S.sub.syncPrev;if(!P||!P.ch)return;const sel=P.ch.filter(c=>!c.info&&!c.off);if(!sel.length){toast("No hay cambios marcados");return}
  toast("Aplicando "+sel.length+" cambios…");let ok=0;const ts=new Date().toISOString(),hoy=todayStr();
  for(const c of sel){try{
    if(c.tipo==="nuevo"){const it=c.it;await db.doc("products/"+it.id).set({id:it.id,negocio:it.negocio,cat:it.cat,marca:it.marca,nombre:it.nombre,tono:it.tono,talla:it.talla,necesita:it.necesita,sku:it.sku,proveedor:"",precio:it.precio,precioNio:c.fijo,fechaIngreso:hoy,vence:"",estadoManual:"",nota:it.nota,foto:null,activo:true,base:{jinotega:num(it.stL),managua:0,bodega:num(it.stB)},transito:0});
      if(isOwner()&&it.costo!=null)await db.doc("data/owner/costs/"+it.id).set({costo:it.costo,envio:num(it.envio)})}
    else if(c.tipo==="datos"){const p={...S.products[c.id]};delete p.id;await db.doc("products/"+c.id).set({...p,...c.upd,id:c.id})}
    else if(c.tipo==="stock")await db.doc("movs/sheet-"+Date.now()+"-"+uid()).set({ts,fecha:hoy,pid:c.id,tipo:"ajuste",qty:c.delta,loc:c.loc,from:null,to:null,nota:"Sincronización con Google Sheet",uid:S.me.id||""});
    else if(c.tipo==="costo")await db.doc("data/owner/costs/"+c.id).set({...(S.costs[c.id]||{}),costo:c.costo,envio:num(c.envio)});
    ok++}catch(e){console.warn(e)}}
  const res=`${ok} de ${sel.length} cambios aplicados`;
  try{await db.doc("data/owner/sync/sheet").set({fecha:ts,resumen:res})}catch(e){}
  audit("Sincronizó con Google Sheet",res);S.sub.syncPrev=null;toast(res);render();
}
async function catSnapshot(){

}

  const us=L||Object.entries(S.roles).map(([id,r])=>({id,usuario:id,...r,isOwner:r.rol==="duena"}));
  return `<div class="top"><div><div class="eyebrow">Usuarios y permisos</div><h1>Equipo</h1></div><button class="btn p" data-act="newuser">+ Vendedora</button></div>
  <div class="card" style="margin-bottom:14px;max-width:80ch"><p style="margin:0">Cada vendedora entra con su <b>usuario y contraseña</b> en esta misma página. Tú eliges qué puede ver y hacer. Costos, compras, gastos, finanzas, equipo y ajustes son solo tuyos, y cada cambio que haga una vendedora te llega por correo.</p></div>

  ${us.map(u=>`<tr><td>${h(u.nombre||"")}${u.isOwner?' <span class="pill info">Dueña</span>':""}</td><td class="mono">${h(u.usuario)}</td><td>${h(u.email||"")}</td><td>${u.activo===false?'<span class="pill bad">Desactivada</span>':'<span class="pill ok">Activa</span>'}</td>

   <label class="f"><span>Estado</span><select id="uf_a"><option value="1" ${u.activo!==false?"selected":""}>Activa</option><option value="0" ${u.activo===false?"selected":""}>Desactivada</option></select></label></div>

  const ids=[...new Set(S.audit.map(a=>a.uid).filter(Boolean))];
  AFTER.push(async()=>{if(!user)return;const ps=await user.profiles(ids);document.querySelectorAll("[data-uidname]").forEach(el=>{const p=ps[el.dataset.uidname];const r=S.roles[el.dataset.uidname];el.textContent=(r&&r.nombre)||(p&&p.name)||"Usuario"})});

};

/* ============ modales ============ */
function modal(title,body,foot){closeModal();const m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${h(title)}"><header><h2 style="margin:0">${h(title)}</h2><button class="btn ghost" data-x aria-label="Cerrar">✕</button></header><div>${body}</div>${foot?`<div class="row" style="justify-content:flex-end">${foot}</div>`:""}</div>`;
 document.body.appendChild(m);m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-x]"))closeModal()});const first=m.querySelector("input,select,textarea");if(first)first.focus();return m}
function closeModal(){const m=$("#modal");if(m)m.remove()}
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():""};

function prodForm(p){
  p=p||{id:nextId(S.negocio==="rashi"?"RS":"HB"),negocio:S.negocio,base:{jinotega:0,managua:0,bodega:0},fechaIngreso:todayStr()};
  const c=S.costs[p.id]||{};const st=S.products[p.id]?stockOf(p.id):null;const sug=suggested(p.id);
  const own=isOwner();const ed=can("inventario");
  const F=(k,l,v,t="text",x="")=>`<label class="f"><span>${l}</span><input id="pf_${k}" type="${t}" value="${h(v??"")}" ${x} ${ed?"":"disabled"}></label>`;
  const m=modal(S.products[p.id]?pname(p.id):"Producto nuevo",`
  ${st?`<div class="row" style="margin-bottom:12px">${Object.keys(LOCS).map(k=>`<span class="pill neu">${LOCSHORT[k]}: ${st[k]}</span>`).join("")}<span class="pill info">Reservado: ${st.reservado}</span><span class="pill info">Tránsito: ${st.transito}</span><span class="pill ${estadoProd(p,st)[1]}">${estadoProd(p,st)[0]}</span></div>`:""}
  <div class="fields">${F("id","ID",p.id,"text","disabled")}
   <label class="f"><span>Negocio</span><select id="pf_negocio" ${ed?"":"disabled"}><option value="hebeluna" ${p.negocio!=="rashi"?"selected":""}>Hebeluna</option><option value="rashi" ${p.negocio==="rashi"?"selected":""}>Rashi Studio</option></select></label>
   <label class="f"><span>Categoría</span><select id="pf_cat" ${ed?"":"disabled"}>${CATS.map(x=>`<option ${p.cat===x?"selected":""}>${x}</option>`).join("")}</select></label>
   ${F("marca","Marca",p.marca)}${F("nombre","Nombre",p.nombre)}${F("tono","Tono / color",p.tono)}${F("talla","Talla",p.talla)}${F("sku","SKU / código",p.sku)}<label class="f"><span>Necesita</span><select id="pf_necesita" ${ed?"":"disabled"}>${["No","Tono","Talla"].map(x=>`<option ${(p.necesita||"No")===x?"selected":""}>${x}</option>`).join("")}</select></label>${F("proveedor","Proveedor",p.proveedor)}
   ${F("precio","Precio de venta (US$)",p.precio,"number",'step="0.01"')}${F("precioNio","Precio fijo en C$ (opcional)",p.precioNio,"number",'step="1"')}
   ${own?F("costo","Costo de adquisición (US$)",c.costo,"number",'step="0.01"')+F("envio","Envío por unidad (US$)",c.envio,"number",'step="0.01"'):""}
   ${F("fechaIngreso","Fecha de ingreso",p.fechaIngreso,"date")}${F("vence","Vence (si aplica)",p.vence,"date")}
   <label class="f"><span>Estado especial</span><select id="pf_estadoManual" ${ed?"":"disabled"}><option value="">Automático</option><option value="preorder" ${p.estadoManual==="preorder"?"selected":""}>Pre-order</option></select></label>
   ${S.products[p.id]?"":`${F("bj","Cantidad inicial Jinotega",0,"number")}${F("bm","Cantidad inicial Managua",0,"number")}${F("bb","Cantidad inicial Bodega",0,"number")}`}
  </div>
  ${own&&sug?`<p class="muted" style="font-size:12.5px">Precio sugerido con tu fórmula: <b>${usd(sug)}</b> · margen actual ${num(p.precio)&&c.costo?pct((num(p.precio)-num(c.costo))/num(p.precio)):"—"} <button class="btn sm" data-usesug="${sug}">Usar sugerido</button></p>`:""}
  <label class="f" style="margin-top:10px"><span>Notas</span><input id="pf_nota" value="${h(p.nota||"")}" ${ed?"":"disabled"}></label>
  ${assets&&ed?`<div class="row" style="margin-top:10px">${p.foto?`<img class="thumb" style="width:56px;height:56px" src="https://drive.google.com/thumbnail?sz=w600&id=${h(p.foto)}" alt="">`:""}<label class="btn sm">Subir foto<input id="pf_foto" type="file" accept="image/*" hidden></label><span id="pf_fotost" class="muted"></span></div>`:""}`,
  ed?`${S.products[p.id]?`<button class="btn danger" data-delprod="${h(p.id)}">Archivar</button>`:""}<button class="btn" data-x>Cancelar</button><button class="btn p" id="pf_save">Guardar</button>`:`<button class="btn" data-x>Cerrar</button>`);
  let foto=p.foto||null;
  const fi=m.querySelector("#pf_foto");if(fi)fi.onchange=async()=>{const f=fi.files[0];if(!f)return;$("#pf_fotost").textContent="Subiendo…";try{const r=await assets.upload(f);foto=r.id;$("#pf_fotost").textContent="Foto lista"}catch(e){$("#pf_fotost").textContent="No se pudo subir la foto"}};
  m.querySelectorAll("[data-usesug]").forEach(b=>b.onclick=()=>{$("#pf_precio").value=b.dataset.usesug});
  const del_=m.querySelector("[data-delprod]");if(del_){let armed=false;del_.onclick=async()=>{if(!armed){armed=true;del_.textContent="¿Seguro? Toca de nuevo";return}await save("products/"+p.id,{...S.products[p.id],activo:false},"Producto archivado","Archivó producto",pname(p.id));closeModal()}}
  const sv=m.querySelector("#pf_save");if(sv)sv.onclick=async()=>{
    if(!val("pf_nombre")){toast("Escribe el nombre del producto");return}
    const isNew=!S.products[p.id];
    const d={...(S.products[p.id]||{}),id:p.id,negocio:val("pf_negocio"),cat:val("pf_cat"),marca:val("pf_marca"),nombre:val("pf_nombre"),tono:val("pf_tono"),talla:val("pf_talla"),sku:val("pf_sku"),necesita:val("pf_necesita"),proveedor:val("pf_proveedor"),
      precio:num(val("pf_precio")),precioNio:val("pf_precioNio")?num(val("pf_precioNio")):null,fechaIngreso:val("pf_fechaIngreso"),vence:val("pf_vence"),estadoManual:val("pf_estadoManual"),nota:val("pf_nota"),foto,activo:true,
      base:isNew?{jinotega:num(val("pf_bj")),managua:num(val("pf_bm")),bodega:num(val("pf_bb"))}:(S.products[p.id].base||{}),transito:num((S.products[p.id]||{}).transito)};
    const changes=isNew?"nuevo":Object.keys(d).filter(k=>JSON.stringify(d[k])!==JSON.stringify((S.products[p.id]||{})[k])).map(k=>k+": "+JSON.stringify((S.products[p.id]||{})[k]??"")+" → "+JSON.stringify(d[k]??"")).join("; ");
    const ok=await save("products/"+p.id,d,isNew?"Producto creado":"Producto actualizado",isNew?"Creó producto":"Editó producto",pname(p.id)+(isNew?"":" · "+changes));
    if(ok&&own&&(val("pf_costo")!==String(c.costo??"")||val("pf_envio")!==String(c.envio??"")))await save("data/owner/costs/"+p.id,{costo:val("pf_costo")===""?null:num(val("pf_costo")),envio:num(val("pf_envio"))});
    if(ok)closeModal()};
}
function nextId(pre){let mx=0;Object.keys(S.products).forEach(k=>{if(k.startsWith(pre+"-")){const n=parseInt(k.slice(pre.length+1));if(n>mx)mx=n}});return pre+"-"+String(mx+1).padStart(3,"0")}

function movForm(pid){
  const opts=Object.values(S.products).filter(p=>p.activo!==false&&(p.negocio||"hebeluna")===S.negocio).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  const m=modal("Movimiento de inventario",`<div class="fields">
   <label class="f" style="grid-column:1/-1"><span>Producto</span><select id="mv_pid">${opts.map(p=>`<option value="${h(p.id)}" ${p.id===pid?"selected":""}>${h(p.id+" · "+pname(p.id))}</option>`).join("")}</select></label>
   <label class="f"><span>Tipo</span><select id="mv_tipo"><option value="ingreso">Ingreso (entra producto)</option><option value="egreso">Egreso (sale sin venta: daño, regalo, uso)</option><option value="traslado">Traslado entre ubicaciones</option><option value="ajuste">Ajuste de conteo (+/−)</option></select></label>

   <label class="f"><span>Ubicación / desde</span><select id="mv_loc">${Object.keys(LOCS).map(k=>`<option value="${k}">${LOCS[k]}</option>`).join("")}</select></label>
   <label class="f"><span>Hacia (solo traslado)</span><select id="mv_to">${Object.keys(LOCS).map(k=>`<option value="${k}" ${k==="jinotega"?"":""}>${LOCS[k]}</option>`).join("")}</select></label>
   <label class="f"><span>Fecha</span><input id="mv_fecha" type="date" value="${todayStr()}"></label>
   <label class="f" style="grid-column:1/-1"><span>Nota</span><input id="mv_nota" placeholder="Ej. llegó compra Amazon, se dañó, conteo físico"></label></div>
   <p class="muted" style="font-size:12px">En “Ajuste” usa número negativo para restar (ej. −2).</p>`,`<button class="btn" data-x>Cancelar</button><button class="btn p" id="mv_save">Registrar</button>`);

   if(await save("movs/"+Date.now()+"-"+uid(),d,"Movimiento registrado","Movimiento de inventario",`${tipo} ${d.qty} · ${pname(d.pid)} · ${tipo==="traslado"?LOCSHORT[d.from]+" → "+LOCSHORT[d.to]:LOCSHORT[d.loc]} · ${d.nota}`))closeModal()};

function receiptText(s){
  const c=S.customers[s.clienteId];const t=c?tierOf(c.id):null;const W=32;const line="-".repeat(W);
  const pad=(a,b)=>{a=String(a);b=String(b);const sp=W-a.length-b.length;return sp>0?a+" ".repeat(sp)+b:a+"\n"+" ".repeat(Math.max(0,W-b.length))+b};
  const wrap=x=>{const out=[];String(x).split(/\s+/).forEach(w=>{const l=out.length?out[out.length-1]:null;if(l!=null&&(l+" "+w).length<=W)out[out.length-1]=l+" "+w;else{while(w.length>W){out.push(w.slice(0,W));w=w.slice(W)}out.push(w)}});return out};
  const center=x=>{x=String(x);const p=Math.max(0,Math.floor((W-x.length)/2));return " ".repeat(p)+x};
  let o=[center(S.cfg.negocio.toUpperCase()),...[S.cfg.ruc?"RUC "+S.cfg.ruc:"",S.cfg.lema,S.cfg.telefono,S.cfg.instagram,(S.cfg.direccion||"").slice(0,W)].filter(Boolean).map(center),line,
   pad("Recibo",s.num),pad("Fecha",fmtD(s.fecha)+" "+(s.ts?new Date(s.ts).toLocaleTimeString("es-NI",{hour:"2-digit",minute:"2-digit"}):"")),pad("Canal",s.canal||""),pad("Estado",s.estado||"")];
  if(c){o.push(line,"Cliente: "+c.nombre);if(c.telefono)o.push("Tel: "+c.telefono);if(c.ciudad)o.push("Ciudad: "+c.ciudad);o.push("Nivel: "+t.t.toUpperCase()+" ("+t.n+" compras)")}
  if(s.tipo==="preorder"||s.estado==="Pre-order")o.push(line,center("PRE-ORDER"),center("Llega en 8 a 15 días"));
  if(s.entrega||s.direccion){o.push(line,"Entrega: "+(s.entrega||""));if(s.direccion){const w=("Dirección: "+s.direccion).match(new RegExp(".{1,"+W+"}(\\s|$)","g"))||[];w.forEach(x=>o.push(x.trim()))}}
  o.push(line);(s.items||[]).forEach(i=>{o.push(...wrap(i.nombre));o.push(pad("  "+i.qty+" x "+usd(i.precio),usd(num(i.qty)*num(i.precio))));if(num(i.desc))o.push(pad("  Descuento","-"+usd(i.desc)))});
  o.push(line,pad("Subtotal",usd(saleSub(s))));if(num(s.descuento))o.push(pad("Descuento","-"+usd(s.descuento)));if(num(s.envio))o.push(pad("Envío",usd(s.envio)));
  o.push(pad("TOTAL US$",usd(saleTotal(s))),pad("TOTAL C$",nio(saleTotal(s))),pad("Pago",s.metodo||""));
  if(s.pagado!=null&&s.pagado!==""&&num(s.pagado)<saleTotal(s)-0.009)o.push(pad(s.tipo==="preorder"?"Abono":"Abonado",usd(s.pagado)),pad(s.tipo==="preorder"?"Saldo al llegar":"Saldo",usd(saleTotal(s)-num(s.pagado))),pad("Saldo C$",nio(saleTotal(s)-num(s.pagado))));
  if(S.cfg.cuentas&&(s.pagado!=null&&s.pagado!==""&&num(s.pagado)<saleTotal(s)-0.009||s.estado==="Pago pendiente"||s.estado==="Pre-order"))o.push(line,"Cuentas para pagar:",...String(S.cfg.cuentas).split("\n").flatMap(x=>wrap(x.replace(/ · /g," ").replace("US$","· US$").replace(/C\$ (\d)/,"· C$ $1"))));
  o.push(line,center("¡Gracias por elegirnos!"),center("Tipo de cambio C$"+num(S.cfg.tasa).toFixed(2)));
  return o.join("\n");
}

async function receiptPDF(s,txt){
  if(!window.jspdf||!downloads){toast("La descarga no está disponible en esta vista");return}
  const lines=txt.split("\n");const doc=new window.jspdf.jsPDF({unit:"mm",format:[80,Math.max(150,lines.length*4.6+58)]});
  doc.setFillColor(154,156,234);doc.rect(0,0,80,4,"F");try{doc.addImage(LOGO_JPG,"JPEG",22,7,36,27.8)}catch(e){}doc.setFont("courier","normal");doc.setFontSize(8.6);
  let y=40;lines.forEach((l,i)=>{if(i===0){doc.setFont("courier","bold");doc.setFontSize(11)}else{doc.setFont("courier",/TOTAL|NIVEL|Nivel/.test(l)?"bold":"normal");doc.setFontSize(8.6)}doc.text(l.replace(/[^\x20-\x7E -ÿ]/g,""),4,y);y+=i===0?5.5:4.2});
  try{await downloads.save({filename:s.num+".pdf",data:doc.output("arraybuffer")});toast("Recibo descargado")}catch(e){if(e&&e.code!=="declined")toast("No se pudo descargar: "+(e.message||e.code))}
}

   ${n("alcance","Alcance")}${n("vistas","Vistas / reproducciones")}${n("interacciones","Interacciones")}${n("guardados","Guardados")}${n("compartidos","Compartidos")}${n("visitas","Visitas al perfil")}${n("mensajes","Mensajes / clics a WhatsApp")}${n("inversion","Pauta invertida (US$)")}</div>`,
   `${!isNew?`<button class="btn danger" id="po_del">Borrar</button>`:""}<button class="btn" data-x>Cancelar</button><button class="btn p" id="po_save">Guardar</button>`);
  const lk=m.querySelector("#po_link1");const detect=async()=>{const u=lk.value.trim();if(!u)return;
    if(/tiktok\.com/i.test(u)){$("#po_plat").value="TikTok";$("#po_formato").value="Video TikTok";
      try{const ac=new AbortController();setTimeout(()=>ac.abort(),6000);const j=await fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(u),{signal:ac.signal}).then(r=>r.json());if(j&&j.title&&!val("po_titulo"))$("#po_titulo").value=j.title.slice(0,120)}catch(e){}}
    else if(/instagram\.com/i.test(u)){$("#po_plat").value="Instagram";$("#po_formato").value=/\/reels?\//i.test(u)?"Reel":/\/stories\//i.test(u)?"Story":"Carrusel"}};
  lk.addEventListener("change",detect);lk.addEventListener("paste",()=>setTimeout(detect,50));
  m.querySelector("#po_save").onclick=async()=>{const id=p.id||"P"+Date.now().toString(36);const d={fecha:val("po_fecha"),plataforma:val("po_plat"),formato:val("po_formato"),pilar:val("po_pilar"),titulo:val("po_titulo"),link:val("po_link1")};["alcance","vistas","interacciones","guardados","compartidos","visitas","mensajes","inversion"].forEach(k=>d[k]=num(val("po_"+k)));
   if(await save("posts/"+id,d,"Post guardado",isNew?"Registró post":"Editó post",d.plataforma+" · "+d.titulo))closeModal()};
  const dl=m.querySelector("#po_del");if(dl){let armed=false;dl.onclick=async()=>{if(!armed){armed=true;dl.textContent="¿Seguro? Toca de nuevo";return}await del("posts/"+p.id,"Post borrado");closeModal()}}
}

function roleEdit(id){const r=S.roles[id]||{};const q=S.reqs[id]||{};
  const m=modal("Datos de la persona",`<div class="fields"><label class="f"><span>Nombre</span><input id="rf_n" value="${h(r.nombre||q.nombre||"")}"></label><label class="f"><span>Correo</span><input id="rf_e" type="email" value="${h(r.email||q.email||"")}"></label></div>`,`<button class="btn" data-x>Cancelar</button><button class="btn p" id="rf_s">Guardar</button>`);
  m.querySelector("#rf_s").onclick=async()=>{const d={...(S.roles[id]||{perms:{vender:true,pedidos:true,clientes:true,catalogo:true},activo:true,rol:"vendedora"}),nombre:val("rf_n"),email:val("rf_e")};if(await save("roles/"+id,d,"Datos guardados"))closeModal()}}

/* ============ exportar ============ */
async function exportXlsx(){
  if(!window.XLSX||!downloads){toast("La exportación no está disponible en esta vista");return}
  const own=isOwner();
  const inv=Object.values(S.products).filter(p=>p.activo!==false).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})).map(p=>{const st=stockOf(p.id);const c=costOf(p.id);const r={ID:p.id,Negocio:p.negocio==="rashi"?"Rashi Studio":"Hebeluna",Categoría:p.cat,Marca:p.marca,Producto:p.nombre,"Tono/Color":p.tono,Talla:p.talla,Necesita:p.necesita||"No",SKU:p.sku,Proveedor:p.proveedor,"Precio US$":num(p.precio),"Precio C$":nioOf(p)};if(own){r["Costo US$"]=c;r.Margen=c!=null&&num(p.precio)?+((num(p.precio)-c)/num(p.precio)).toFixed(3):null}
   Object.assign(r,{Jinotega:st.jinotega,Managua:st.managua,Bodega:st.bodega,Reservado:st.reservado,Tránsito:st.transito,Disponible:st.disponible,Estado:estadoProd(p,st)[0],"Valor venta US$":Math.max(0,st.total)*num(p.precio),"Valor venta C$":Math.max(0,st.total)*nioOf(p),Ingreso:p.fechaIngreso,Vence:p.vence||"",Notas:p.nota||"",Etiqueta:etiqueta(p)});if(own){const c2=S.costs[p.id]||{};r["Envío US$"]=c2.envio||0;r["Precio sugerido US$"]=suggested(p.id)||null}return r});
  const ven=S.sales.flatMap(s=>(s.items||[]).map(i=>({Recibo:s.num,Fecha:s.fecha,Negocio:s.negocio,Cliente:(S.customers[s.clienteId]||{}).nombre||"",Canal:s.canal,Método:s.metodo,Estado:s.estado,ID:i.pid,Producto:i.nombre,Cant:i.qty,"Precio US$":i.precio,"Desc US$":i.desc,...(own?{"Costo US$":i.costo!=null?i.costo:costOf(i.pid)}:{})})));
  const cli=Object.values(S.customers).map(c=>{const t=tierOf(c.id);return{Nombre:c.nombre,Teléfono:c.telefono,Ciudad:c.ciudad,Cumpleaños:c.cumple,Nivel:t.t,Compras:t.n}});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(inv),"Inventario");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ven.length?ven:[{Recibo:""}]),"Ventas");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cli.length?cli:[{Nombre:""}]),"Clientes");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{await downloads.save({filename:"Hebeluna_"+todayStr()+".xlsx",data:out});toast("Archivo listo")}catch(e){if(e&&e.code!=="declined")toast("No se pudo exportar")}
}

/* ============ eventos ============ */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-edituser],[data-go],[data-neg],[data-sub],[data-act],[data-add],[data-rm],[data-prod],[data-sale],[data-cli],[data-ord],[data-gasto],[data-post],[data-role]");if(!t||t.closest("#modal")&&!t.matches("[data-sale]"))return;
  const d=t.dataset;
  if(d.edituser){userForm((S.sub.users||[]).find(u=>u.usuario===d.edituser));return}
  if(d.go){if(d.filter){S.filters={...S.filters,estado:d.filter}}go(d.go);return}
  if(d.neg){S.negocio=d.neg;S.cart=[];render();return}
  if(d.sub){const [k,v]=d.sub.split(":");S.sub[k]=v;render();return}
  if(d.add){const p=S.products[d.add];const ex=S.cart.find(i=>i.pid===d.add);if(ex)ex.qty++;else S.cart.push({pid:d.add,qty:1,precio:num(p.precio)||(num(p.precioNio)/num(S.cfg.tasa)),desc:0});render();return}
  if(d.rm!=null){S.cart.splice(+d.rm,1);render();return}
  if(d.prod){prodForm(S.products[d.prod]);return}
  if(d.sale){saleView(d.sale);return}
  if(d.cli){cliForm(S.customers[d.cli]);return}
  if(d.ord){ordForm(S.compras.find(o=>o.id===d.ord));return}
  if(d.gasto){gastoForm(S.gastos.find(g=>g.id===d.gasto));return}
  if(d.post){postForm(S.posts.find(p=>p.id===d.post));return}
  if(d.role){const [id,a]=d.role.split("|");if(a==="edit"){roleEdit(id);return}const r={...(S.roles[id]||{perms:{vender:true,pedidos:true,clientes:true,catalogo:true},rol:"vendedora",nombre:(S.reqs[id]||{}).nombre||"",email:(S.reqs[id]||{}).email||""}),activo:a==="on"};await save("roles/"+id,r,a==="on"?"Acceso activado":"Acceso desactivado");return}
  switch(d.act){
   case"newprod":prodForm();break;case"encargo":encargoForm();break;case"quickord":go("comp");setTimeout(()=>ordForm(),50);break;case"quickgasto":go("fin");setTimeout(()=>gastoForm(),50);break;case"mov":movForm();break;case"newcli":cliForm(null,id=>{S.cartMeta.cli=id;render()});break;case"checkout":checkout();break;
   case"neword":ordForm();break;case"newgasto":gastoForm();break;case"newpost":postForm();break;case"export":exportXlsx();break;
   case"syncpaste":{const t=val("sync_paste");if(!t){toast("Pega primero la hoja copiada");break}const r=parseSheetRows(t.split(/\r?\n/).map(l=>l.split("\t")));S.sub.syncPrev=r.err?{err:r.err}:{n:r.items.length,ch:diffSheet(r.items)};render();break}
   case"syncapply":await applySync();break;case"newuser":userForm();break;case"logout":window.HBM&&window.HBM.logout();break;case"mypass":passForm();break;case"syncall":(S.sub.syncPrev.ch||[]).forEach(c=>c.off=false);render();break;case"syncnone":(S.sub.syncPrev.ch||[]).forEach(c=>c.off=true);render();break;case"catsnap":await catSnapshot();break;
   case"copycat":{const lines=[];Object.values(S.products).filter(p=>(p.negocio||"hebeluna")===S.negocio&&p.activo!==false).forEach(p=>{const st=stockOf(p.id);if(st.disponible>0&&num(p.precio))lines.push(`• ${pname(p.id)} — ${usd(p.precio)} / C$${nioOf(p).toLocaleString("en-US")}`)});try{await navigator.clipboard.writeText(`✨ ${S.cfg.negocio} · disponible hoy\n\n`+lines.join("\n")+`\n\nPedidos: ${S.cfg.telefono}`);toast("Catálogo copiado")}catch(e){toast("No se pudo copiar en esta vista")}break}
   case"savecfg":{const c={...S.cfg};["tasa","redondeo","stockCritico","stockBajo","diasSinRotacion","diasVence"].forEach(k=>c[k]=num(val("cfg_"+k)));["impuesto","ganancia","margenObjetivo"].forEach(k=>c[k]=num(val("cfg_"+k))/100);["negocio","ruc","lema","telefono","instagram","direccion","ownerEmail","sheetUrl","canvaUrl"].forEach(k=>c[k]=val("cfg_"+k));c.cuentas=(document.getElementById("cfg_cuentas")||{}).value||"";
     c.metodos=val("cfg_metodos").split("\n").map(x=>x.trim()).filter(Boolean);c.canales=val("cfg_canales").split("\n").map(x=>x.trim()).filter(Boolean);await save("config/main",c,"Ajustes guardados","Cambió ajustes","");break}
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;if(t.closest("#modal"))return;
  if(t.dataset.perm){const [id,k]=t.dataset.perm.split("|");const r={...(S.roles[id]||{rol:"vendedora",activo:false,nombre:(S.reqs[id]||{}).nombre||"",email:(S.reqs[id]||{}).email||""})};r.perms={...(r.perms||{}),[k]:t.checked};await save("roles/"+id,r,"Permiso actualizado");return}
  if(t.dataset.cq!=null){S.cart[t.dataset.cq].qty=Math.max(1,num(t.value));render();return}
  if(t.dataset.cd!=null){S.cart[t.dataset.cd].desc=Math.max(0,num(t.value));render();return}
  const map={c_loc:"loc",c_cli:"cli",c_met:"metodo",c_can:"canal",c_est:"estado",c_post:"post",c_desc:"descuento",c_env:"envio",c_pag:"pagado",c_nota:"nota",c_ent:"entrega",c_dir:"direccion",c_tipo:"tipo"};
  if(map[t.id]){S.cartMeta[map[t.id]]=t.value;render();return}
  if(t.id==="sync_file"&&t.files&&t.files[0]){readSyncFile(t.files[0]);return}
  if(t.dataset.sc!=null){const c=(S.sub.syncPrev||{}).ch[+t.dataset.sc];if(c)c.off=!t.checked;return}
  if(t.id==="mv_tipo"){S.sub.mvtipo=t.value;render()}if(t.id==="mv_desde"){S.sub.mvdesde=t.value;render()}if(t.id==="mv_hasta"){S.sub.mvhasta=t.value;render()}
  if(t.id==="f_cat"){S.filters.cat=t.value;render()}if(t.id==="f_est"){S.filters.estado=t.value;render()}if(t.id==="f_loc"){S.filters.loc=t.value;render()}
});
let it;document.addEventListener("input",e=>{const t=e.target;if(t.closest("#modal"))return;const k={f_q:["filters","q"],posq:["sub","posq"],cliq:["sub","cliq"],catq:["sub","catq"]}[t.id];if(!k)return;S[k[0]][k[1]]=t.value;clearTimeout(it);it=setTimeout(render,180)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("oc"))e.target.click()});

boot();
})();
</script>
